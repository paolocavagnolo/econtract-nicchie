; PlatformIO – progetto EQSP_PLC (ESP32-S3 / EQSP32)
; File uguale per tutti i progetti EQSP_PLC.
; I percorsi -I / -L puntano alla cartella dove PlatformIO scarica la libreria EQSP32
; (soluzione dell'errore "cannot find -lEQSP32").
; Dopo una modifica: pio run -t clean, poi compila.

[env:esp32-s3-devkitc-1]
platform = espressif32@5.2.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
	https://github.com/erqos/EQSP32.git#v0.5.1
	gin66/FastAccelStepper@0.31.8
	madhephaestus/ESP32Encoder@0.11.7
platform_packages =
	framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32#2.0.17
	toolchain-riscv32-esp @ 8.4.0+2021r2-patch5
; libreria comune della pagina web (firmware/lib_comune/PaginaWebNicchie)
lib_extra_dirs =
	${PROJECT_DIR}/../../lib_comune
build_flags =
	-I${PROJECT_DIR}/.pio/libdeps/esp32-s3-devkitc-1/EQSP32/src
	-L${PROJECT_DIR}/.pio/libdeps/esp32-s3-devkitc-1/EQSP32/src/esp32s3
	-lEQSP32
monitor_filters = send_on_enter
